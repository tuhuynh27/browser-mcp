<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Browser MCP</title>
    <style>
      :root {
        --ink: #12203f;
        --ink-raised: #1a2b50;
        --ink-line: #2a3d68;
        --paper: #f4f6fa;
        --muted: #8d9bb8;
        --blue: #5b8cff;
        --green: #3dd598;
        --amber: #f5b74f;
        --red: #ff6b6b;
        --state: var(--muted);
      }

      body[data-state='connecting'] { --state: var(--amber); }
      body[data-state='connected'] { --state: var(--green); }
      body[data-state='unauthorized'],
      body[data-state='replaced'] { --state: var(--red); }

      * { box-sizing: border-box; }

      body {
        width: 320px;
        margin: 0;
        padding: 18px;
        background: var(--ink);
        color: var(--paper);
        font: 13px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header img {
        width: 28px;
        height: 28px;
      }

      h1 {
        margin: 0;
        font-size: 15px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .link {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 10px;
        margin: 22px 0 6px;
      }

      .node {
        width: 14px;
        height: 14px;
        border: 3px solid var(--blue);
        border-radius: 50%;
      }

      .node.far {
        border-color: var(--ink-line);
        background: var(--ink-line);
        transition: background 0.4s, border-color 0.4s;
      }

      body[data-state='connected'] .node.far {
        border-color: var(--green);
        background: var(--green);
      }

      .wire {
        position: relative;
        height: 3px;
        border-radius: 2px;
        background: var(--ink-line);
        overflow: hidden;
      }

      .wire::after {
        content: '';
        position: absolute;
        inset: 0;
        background: var(--state);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.5s ease;
      }

      body[data-state='connected'] .wire::after { transform: scaleX(1); }

      body[data-state='connecting'] .wire::after {
        width: 40%;
        transform: none;
        animation: seek 1.1s ease-in-out infinite alternate;
      }

      @keyframes seek {
        from { left: 0; }
        to { left: 60%; }
      }

      .ends {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 11px;
      }

      #status {
        margin: 16px 0 18px;
        min-height: 1.4em;
        color: var(--state);
        font-weight: 550;
      }

      label {
        display: block;
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 12px;
      }

      input {
        display: block;
        width: 100%;
        margin-top: 5px;
        padding: 8px 10px;
        border: 1px solid var(--ink-line);
        border-radius: 8px;
        background: var(--ink-raised);
        color: var(--paper);
        font: 13px ui-monospace, 'SF Mono', Menlo, monospace;
      }

      input::placeholder { color: #5d6f96; }

      input:focus-visible,
      button:focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      button {
        width: 100%;
        margin-top: 6px;
        padding: 9px;
        border: 0;
        border-radius: 8px;
        background: var(--blue);
        color: var(--ink);
        font: inherit;
        font-weight: 650;
        cursor: pointer;
        transition: filter 0.15s;
      }

      button:hover { filter: brightness(1.08); }

      button.off {
        background: transparent;
        box-shadow: inset 0 0 0 1px var(--ink-line);
        color: var(--paper);
      }

      @media (prefers-reduced-motion: reduce) {
        .wire::after,
        .node.far { transition: none; }
        body[data-state='connecting'] .wire::after { animation: none; width: 100%; opacity: 0.5; }
      }
    </style>
  </head>
  <body data-state="disconnected">
    <header>
      <img src="icons/icon.svg" alt="" />
      <h1>Browser MCP</h1>
    </header>

    <div class="link" aria-hidden="true">
      <span class="node"></span>
      <span class="wire"></span>
      <span class="node far"></span>
    </div>
    <div class="ends" aria-hidden="true">
      <span>This browser</span>
      <span>Relay</span>
    </div>

    <div id="status" role="status"></div>

    <label>
      Relay URL
      <input id="url" type="url" placeholder="http://127.0.0.1:8787" spellcheck="false" />
    </label>
    <label>
      Token
      <input id="token" type="password" autocomplete="off" />
    </label>

    <button id="toggle">Connect</button>
    <script type="module" src="dist/popup.js"></script>
  </body>
</html>
